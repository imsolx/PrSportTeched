services:
  - type: web
    name: prsport
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PRSPORT_TIMEZONE
        value: Asia/Bangkok
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
